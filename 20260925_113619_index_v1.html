<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamasei Puntu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--sea:#58cc02;--sea-light:#e5f8cc;--sea-dark:#46a302;--storm:#afafaf;--coral:#ff4b4b;--coral-light:#ffe0e0;--dark:#3c3c3c;--mid:#777;--light-border:#e5e5e5;--amber:#f59e0b;--amber-light:#fef3c7;--purple:#8b5cf6}
body{font-family:-apple-system,'Helvetica Neue',system-ui,sans-serif;background:#f7f7f7;color:var(--dark);line-height:1.6;min-height:100vh}
body.special{background:#fdf8f5;--sea:#e85d26;--sea-light:#fef0e9;--sea-dark:#c44a1c}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400}
.container{max-width:720px;margin:0 auto;padding:24px 20px}
.special-banner{background:linear-gradient(135deg,#e85d26,#d44a1c);color:#fff;text-align:center;padding:14px 20px;border-radius:10px;margin-bottom:24px}
.special-banner .sb-tag{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.special-banner .sb-title{font-family:Georgia,serif;font-size:1.6rem}
.landing{text-align:center;padding:30px 20px 40px}.landing h1{font-size:2.6rem;color:var(--dark);line-height:1.1;margin-bottom:8px}.landing .sub{font-size:1.05rem;color:var(--storm);margin-bottom:30px}.landing .bio{max-width:540px;margin:0 auto 24px;font-size:.92rem;color:var(--mid);line-height:1.7;text-align:left}
.song-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.song-card{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;width:260px;cursor:pointer;transition:all .2s;text-align:left;box-shadow:0 2px 0 var(--light-border)}.song-card:hover{border-color:var(--sea);box-shadow:0 2px 0 var(--sea);transform:translateY(-1px)}.song-card h3{font-size:1.4rem;color:var(--dark);margin-bottom:6px}.song-card p{font-size:.85rem;color:var(--storm);line-height:1.5}
.top-bar{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--light-border);margin-bottom:24px}.back-btn{background:0 0;border:none;cursor:pointer;font-size:1.4rem;color:var(--storm);padding:4px 8px;border-radius:6px}.back-btn:hover{background:rgba(0,0,0,.05)}.top-bar h2{font-size:1.5rem;color:var(--dark)}
.tabs{display:flex;gap:4px;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--light-border);margin-bottom:28px}.tab{flex:1;padding:10px 3px;border:none;background:0 0;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.66rem;font-weight:500;color:var(--storm);cursor:pointer;transition:all .15s}.tab.active{background:var(--sea);color:#fff}
.intro-section{background:#fff;border-radius:10px;padding:28px 24px;border:1px solid var(--light-border)}.intro-section h3{font-size:1.3rem;color:var(--dark);margin-bottom:12px}.intro-section p{font-size:.92rem;color:var(--mid);line-height:1.7}.intro-section .rec{margin-top:14px;padding:12px 16px;background:#f0f7ff;border-radius:8px;font-size:.85rem;color:#2563eb}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.vocab-card{background:#fff;border:1px solid var(--light-border);border-radius:8px;padding:16px 18px;cursor:pointer;transition:all .15s;min-height:72px}.vocab-card:hover{border-color:var(--sea)}.vocab-card .w{font-family:Georgia,serif;font-size:1.2rem;color:var(--dark)}.vocab-card .flip-hint{font-size:.72rem;color:var(--storm);margin-top:6px;opacity:.6}.vocab-card .es{font-size:.85rem;color:var(--mid);margin-top:6px;padding-top:6px;border-top:1px solid var(--light-border)}.vocab-card .note{font-size:.78rem;color:var(--sea-dark);margin-top:4px;font-style:italic}
.vocab-morph-btn{display:block;margin-top:8px;padding:6px 12px;background:#fef9e7;border:1.5px solid #f0d060;border-radius:6px;font-family:-apple-system,sans-serif;font-size:.75rem;font-weight:600;color:#92750c;cursor:pointer;text-align:center}.vocab-morph-btn:hover{background:#fef08a}.vocab-morph-reveal{margin-top:8px;padding:10px 12px;background:#fef9e7;border-radius:6px;border:1px solid #f0d060}.vocab-morph-reveal .morph-root{background:#fef08a;color:#1a1a1a;font-weight:600;padding:1px 5px;border-radius:3px}.vocab-morph-reveal .morph-main{font-size:.9rem;color:#1a1a1a}
.vocab-ant-btn{display:block;margin-top:8px;padding:6px 12px;background:#f0ebff;border:1.5px solid var(--purple);border-radius:6px;font-family:-apple-system,sans-serif;font-size:.75rem;font-weight:600;color:var(--purple);cursor:pointer;text-align:center}.vocab-ant-btn:hover{background:#e4dafc}.vocab-ant-reveal{margin-top:8px;padding:10px 12px;background:#f0ebff;border-radius:6px;border:1px solid var(--purple)}.vocab-ant-reveal .ant-word-big{font-family:Georgia,serif;font-size:1.05rem;color:var(--purple)}.vocab-ant-reveal .ant-es{font-size:.8rem;color:var(--mid);margin-top:2px}
.level-header{display:flex;align-items:center;gap:10px;margin:24px 0 14px}.level-header:first-of-type{margin-top:0}.level-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:.78rem;font-weight:700;color:#fff}.level-badge.l1{background:var(--sea)}.level-badge.l2{background:var(--amber)}.level-badge.l3{background:var(--coral)}.level-text{font-size:.82rem;font-weight:500;color:var(--mid)}
.known-card{background:#fff;border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:8px;padding:18px 18px 16px;margin-bottom:16px}.known-card .w{font-family:Georgia,serif;font-size:1.2rem;color:var(--dark)}.known-card .es{font-size:.85rem;color:var(--mid);margin-top:2px;margin-bottom:12px}.known-ctx{background:#fefcf5;border-radius:6px;padding:10px 14px;margin-bottom:8px}.known-ctx-label{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}.known-ctx-label.orig{color:var(--storm)}.known-ctx-label.here{color:var(--amber)}.known-ctx-phrase{font-family:Georgia,serif;font-size:.95rem;color:var(--dark);line-height:1.4}.known-ctx-trans{font-size:.8rem;color:var(--mid);margin-top:2px}.known-arrow{text-align:center;color:var(--amber);font-size:1.1rem;margin:4px 0}
.phrase-block{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:20px 24px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}.phrase-block:hover{border-color:var(--sea)}.phrase-block.has-known{background:#fffdf5;border-color:#f0e6c8}.phrase-block.has-known:hover{border-color:var(--amber)}.phrase-block .known-tag{display:inline-block;font-size:.68rem;color:var(--amber);background:var(--amber-light);padding:2px 8px;border-radius:10px;margin-top:8px}
.phrase-w{font-family:Georgia,serif;font-size:1.15rem;color:var(--dark);line-height:1.4}.phrase-es{font-size:.88rem;color:var(--mid);margin-top:10px;padding-top:10px;border-top:1px solid var(--light-border)}.phrase-note{font-size:.8rem;color:var(--sea-dark);margin-top:8px;font-style:italic;line-height:1.5}
.grammar-toggle{display:inline-block;margin-top:10px;font-size:.78rem;font-weight:500;color:var(--sea-dark);cursor:pointer;border:none;background:0 0;font-family:-apple-system,sans-serif;padding:4px 0}.grammar-toggle:hover{text-decoration:underline}.grammar-box{margin-top:10px;padding:14px 16px;background:var(--sea-light);border-radius:8px;font-size:.82rem;line-height:1.8;color:var(--dark)}.grammar-box .conj{color:var(--sea-dark);font-weight:600}.grammar-box .label{color:var(--storm);font-size:.76rem}
.reveal-all-btn{display:inline-block;margin-bottom:16px;padding:8px 16px;background:0 0;border:1.5px solid var(--light-border);border-radius:8px;font-family:-apple-system,sans-serif;font-size:.8rem;font-weight:500;color:var(--storm);cursor:pointer}.reveal-all-btn:hover{border-color:var(--sea);color:var(--sea-dark)}
.praktika-block{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:24px;margin-bottom:16px}.praktika-original{font-family:Georgia,serif;font-size:1.1rem;color:var(--dark);margin-bottom:4px}.praktika-trans{font-size:.82rem;color:var(--storm);margin-bottom:14px}.praktika-challenge{font-size:.88rem;font-weight:500;color:var(--sea-dark);margin-bottom:12px}.praktika-input{width:100%;padding:12px 14px;border:1.5px solid var(--light-border);border-radius:8px;font-family:-apple-system,sans-serif;font-size:.92rem;color:var(--dark);outline:0}.praktika-input:focus{border-color:var(--sea)}.praktika-show{margin-top:10px;padding:8px 16px;background:0 0;border:1.5px solid var(--light-border);border-radius:8px;font-family:-apple-system,sans-serif;font-size:.8rem;font-weight:500;color:var(--storm);cursor:pointer}.praktika-show:hover{border-color:var(--sea);color:var(--sea-dark)}.praktika-answer{margin-top:12px;padding:14px 16px;background:var(--sea-light);border-radius:8px}.praktika-answer .ans{font-family:Georgia,serif;font-size:1.1rem;color:var(--sea-dark)}.praktika-answer .exp{font-size:.8rem;color:var(--mid);margin-top:4px}
.quiz-header{text-align:center;margin-bottom:28px}.quiz-header h3{font-size:1.4rem;color:var(--dark);margin-bottom:6px}.quiz-header p{font-size:.88rem;color:var(--storm)}.quiz-type-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}.quiz-type-btn{padding:16px 20px;border-radius:10px;font-family:-apple-system,sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;flex:1;max-width:240px;text-align:center;background:#fff;border:1.5px solid var(--light-border);color:var(--dark);box-shadow:0 2px 0 var(--light-border)}.quiz-type-btn:hover{border-color:var(--sea)}.quiz-type-btn:active{box-shadow:none;transform:translateY(2px)}.quiz-type-btn .qt-icon{font-size:1.4rem;margin-bottom:6px}.quiz-type-btn .qt-label{font-size:.82rem;color:var(--mid);font-weight:400}
.quiz-progress{height:4px;background:var(--light-border);border-radius:2px;margin-bottom:24px;overflow:hidden}.quiz-progress-bar{height:100%;background:var(--sea);border-radius:2px;transition:width .3s ease}.quiz-question{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;text-align:center}.quiz-prompt-label{font-size:.78rem;color:var(--storm);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}.quiz-prompt{font-family:Georgia,serif;font-size:1.4rem;color:var(--dark);margin-bottom:24px;line-height:1.3}
.quiz-mode-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.quiz-mode-btn{padding:14px 24px;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;flex:1;max-width:220px}.quiz-mode-btn.test{background:var(--sea);color:#fff;border:1.5px solid var(--sea);box-shadow:0 3px 0 var(--sea-dark)}.quiz-mode-btn.test:active{box-shadow:none;transform:translateY(2px)}.quiz-mode-btn.reveal{background:#fff;color:var(--dark);border:1.5px solid var(--light-border);box-shadow:0 3px 0 var(--light-border)}.quiz-mode-btn.reveal:active{box-shadow:none;transform:translateY(2px)}
.quiz-options{display:flex;flex-direction:column;gap:10px}.quiz-opt{padding:14px 18px;border:1.5px solid var(--light-border);border-radius:8px;background:#fff;cursor:pointer;font-family:-apple-system,sans-serif;font-size:.9rem;color:var(--dark);text-align:left}.quiz-opt:hover:not(.locked){border-color:var(--sea);background:var(--sea-light)}.quiz-opt.correct{border-color:var(--sea);background:var(--sea-light);color:var(--sea-dark);font-weight:600}.quiz-opt.wrong{border-color:var(--coral);background:var(--coral-light);color:var(--coral)}.quiz-opt.locked{cursor:default}.quiz-opt.dim{opacity:.45}
.quiz-reveal-answer{padding:18px 24px;background:var(--sea-light);border:1.5px solid var(--sea);border-radius:8px;text-align:center}.quiz-reveal-answer .ans-label{font-size:.76rem;color:var(--storm);margin-bottom:6px}.quiz-reveal-answer .ans-text{font-family:Georgia,serif;font-size:1.3rem;color:var(--sea-dark)}
.quiz-next{display:block;margin:20px auto 0;padding:12px 32px;background:var(--sea);color:#fff;border:none;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;box-shadow:0 3px 0 var(--sea-dark)}.quiz-next:active{box-shadow:none;transform:translateY(2px)}
.quiz-result{text-align:center;padding:40px 20px}.quiz-result .score{font-family:Georgia,serif;font-size:3rem;color:var(--dark)}.quiz-result .msg{font-size:1rem;color:var(--storm);margin:8px 0 28px}.restart-btn{padding:12px 28px;background:var(--sea);color:#fff;border:none;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;margin:0 6px;box-shadow:0 3px 0 var(--sea-dark)}.restart-btn:active{box-shadow:none;transform:translateY(2px)}.restart-btn.outline{background:#fff;border:1.5px solid var(--light-border);color:var(--storm);box-shadow:0 3px 0 var(--light-border)}
.section-label{font-size:.78rem;font-weight:600;color:var(--storm);letter-spacing:.03em;margin-bottom:14px}
.combined-quiz-btn{padding:14px 32px;background:var(--sea);color:#fff;border:none;border-radius:10px;font-family:-apple-system,sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--sea-dark)}.combined-quiz-btn:active{box-shadow:none;transform:translateY(2px)}
.letra-box{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;font-family:Georgia,serif;font-size:1.05rem;line-height:2.2;color:var(--dark)}
.gernika-box{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;font-family:Georgia,serif;font-size:.95rem;line-height:2.2;color:var(--dark)}
.loading{text-align:center;padding:80px 20px;color:var(--storm);font-size:1rem}
@media(max-width:500px){.landing h1{font-size:2rem}.song-cards{flex-direction:column;align-items:center}.song-card{width:100%}.vocab-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">Kargatzen... / Cargando...</div></div>
<script>
let D=null;const wk=w=>D.lang==='eu'?w.eu:w.fr;
const L={eu:{intro:'Sarrera',known:'Ezagunak',vocab:'Hitzak',letra:'Letra',phrases:'Esaldiak',praktika:'Praktika',quiz:'Azterketa',showAll:'Erakutsi denak',hideAll:'Ezkutatu',morphBtn:'Nondik dator? 🔍',antBtn:'Aurkakoa ↔',transHint:'itzulpena ↓',showAns:'Erantzuna ikusi',hideAns:'Ezkutatu',next:'Hurrengoa →',quizWords:'Hitzak',quizPhrases:'Esaldiak',qWhat:'Zer esan nahi du?',qHow:'Nola esaten da euskaraz?',qRemember:'Gogoratzen duzu?',qTranslate:'Itzuli',excellent:'Bikain!',good:'Ondo!',retry:'Saiatu berriro!',again:'Berriro',back:'Atzera',options:'Aukerak',answer:'Erantzuna',seen:'ikusi',allSeen:'Denak ikusi dituzu.',combined:'Azterketa orokorra',l1:'Oinarrizkoa',l2:'Ertaina',l3:'Aurreratua'},
fr:{intro:'Intro',known:'Déjà vu',vocab:'Vocabulaire',letra:'Letra',phrases:'Phrases',praktika:'Pratique',quiz:'Examen',showAll:'Mostrar todas',hideAll:'Ocultar',morphBtn:"D'où vient-il? 🔍",antBtn:'Antonyme ↔',transHint:'traduction ↓',showAns:'Voir la réponse',hideAns:'Cacher',next:'Suivant →',quizWords:'Mots',quizPhrases:'Phrases',qWhat:'Que veut dire?',qHow:'En français?',qRemember:'Déjà vu?',qTranslate:'Traduis',excellent:'Excellent!',good:'Pas mal!',retry:'Courage!',again:'Réessayer',back:'Retour',options:'Options',answer:'Réponse',seen:'vues',allSeen:'Tout vu.',combined:'Examen combiné',l1:'Básico',l2:'Intermedio',l3:'Avanzado'}};
let t;const state={view:'landing',song:null,tab:'intro',openGrammar:new Set,revP:new Set,revV:new Set,revPr:new Set,revA:new Set,revM:new Set,qType:null,qQs:[],qI:0,qS:0,qT:0,qAns:false,qDone:false,qMode:null,qSel:null};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getSong(){return D.songs[state.song];}
function clearSets(){state.openGrammar.clear();state.revP.clear();state.revV.clear();state.revPr.clear();state.revA.clear();state.revM.clear();resetQ();}
function resetQ(){state.qQs=[];state.qI=0;state.qS=0;state.qT=0;state.qAns=false;state.qDone=false;state.qMode=null;state.qSel=null;}

function render(){const a=document.getElementById('app');
if(!D){a.innerHTML='<div class="loading">Kargatzen... / Cargando...</div>';return;}
t=L[D.lang]||L.eu;
if(state.view==='landing')a.innerHTML=renderLanding();
else if(state.view==='gernika')a.innerHTML=renderGernika();
else if(state.view==='combined')a.innerHTML=renderCombinedQ();
else a.innerHTML=renderSong();
bindEvents();}

function renderLanding(){
const isSpecial=D.type==='special';
const songKeys=D.songs?Object.keys(D.songs):[];
let h='';
if(isSpecial)h+=`<div class="special-banner"><div class="sb-tag">Hamasei Puntu — Edizio Berezia</div><div class="sb-title">${D.title}</div></div>`;
h+=`<div class="landing"><h1>${D.title}</h1><p class="sub">${D.subtitle||''}</p><div class="bio">${D.bio||''}</div>`;
if(D.spotifyRec)h+=`<p style="font-size:.88rem;color:var(--mid);line-height:1.7;margin-bottom:24px;max-width:540px;margin-left:auto;margin-right:auto;text-align:left"><span style="font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)">Gomendio berezia</span><br>${D.spotifyRec.text} <a href="${D.spotifyRec.url}" target="_blank" style="color:var(--sea);text-decoration:underline">Abrir en Spotify</a></p>`;
if(D.mentions)h+=`<p style="font-size:.88rem;color:var(--mid);line-height:1.7;margin-bottom:24px;max-width:540px;margin-left:auto;margin-right:auto;text-align:left"><span style="color:var(--sea);font-weight:600">Aipamen bereziak:</span> ${D.mentions}</p>`;
h+=`<div class="song-cards">${songKeys.map(k=>{const s=D.songs[k];return`<div class="song-card" data-song="${k}"><h3>${s.title}</h3><p>${s.cardDesc||s.introEs?.substring(0,80)+'...'||''}</p></div>`;}).join('')}</div>`;
if(songKeys.length>1)h+=`<div style="text-align:center;margin-top:28px"><button class="combined-quiz-btn" data-action="combined-quiz">${t.combined}</button></div>`;
if(D.gernika)h+=`<div style="margin-top:28px"><div class="song-card" style="width:100%;max-width:540px;margin:0 auto;border-left:4px solid var(--sea)" data-song="gernika"><h3>${D.gernika.title} <span style="font-family:-apple-system,sans-serif;font-size:.75rem;font-weight:500;color:var(--storm);margin-left:8px">EXTRA</span></h3><p>${D.gernika.introEs?.substring(0,80)||''}...</p></div></div>`;
h+='</div>';return h;}

function renderSong(){
const s=getSong();if(!s)return'';
const isSpecial=D.type==='special';
const tabs=[{id:'intro',l:t.intro},{id:'known',l:t.known},{id:'vocab',l:t.vocab},{id:'letra',l:t.letra},{id:'phrases',l:t.phrases},{id:'praktika',l:t.praktika},{id:'quiz',l:t.quiz}];
let c='';
if(state.tab==='intro')c=rIntro(s);
else if(state.tab==='known')c=rKnown(s);
else if(state.tab==='vocab')c=rVocab(s);
else if(state.tab==='letra')c=rLetra(s);
else if(state.tab==='phrases')c=rPhrases(s);
else if(state.tab==='praktika')c=rPraktika(s);
else if(state.tab==='quiz')c=rQuiz(s);
let h='';
if(isSpecial)h+=`<div class="special-banner"><div class="sb-tag">Edizio Berezia</div><div class="sb-title">${D.title}</div></div>`;
h+=`<div class="top-bar"><button class="back-btn" data-action="back">←</button><h2>${s.title}</h2></div>`;
h+=`<div class="tabs">${tabs.map(tb=>`<button class="tab ${state.tab===tb.id?'active':''}" data-tab="${tb.id}">${tb.l}</button>`).join('')}</div>${c}`;
return h;}

function rIntro(s){return`<div class="intro-section"><h3>${s.artist?s.artist+' — ':''}${s.title}</h3><p>${s.introEs}</p></div>`;}

function rKnown(s){const kw=s.known||[];if(!kw.length)return`<p style="color:var(--mid)">No hay palabras conocidas de canciones anteriores.</p>`;
const knownLabel=D.lang==='eu'?'Hitz ezagunak — Palabras que ya viste':'Déjà vu — Palabras que ya viste';
return`<p class="section-label">${knownLabel}</p>${kw.map(w=>`<div class="known-card"><div class="w">${wk(w)}</div><div class="es">${w.es}</div><div class="known-ctx"><div class="known-ctx-label orig">${w.origSong}</div><div class="known-ctx-phrase">${w.orig}</div><div class="known-ctx-trans">${w.origEs}</div></div><div class="known-arrow">↓</div><div class="known-ctx"><div class="known-ctx-label here">${s.title}</div><div class="known-ctx-phrase">${w.here}</div><div class="known-ctx-trans">${w.hereEs}</div></div></div>`).join('')}`;}

function rVocab(s){const v=s.vocab||[];const allR=v.every((_,i)=>state.revV.has('v-'+i));
const lvs=[{n:1,l:t.l1,c:'l1'},{n:2,l:t.l2,c:'l2'},{n:3,l:t.l3,c:'l3'}];
let h=`<p class="section-label">${t.vocab}</p><button class="reveal-all-btn" data-action="reveal-all-vocab">${allR?t.hideAll:t.showAll}</button>`;
lvs.forEach(lv=>{const ws=v.map((w,i)=>({...w,idx:i})).filter(w=>w.level===lv.n);if(!ws.length)return;
h+=`<div class="level-header"><span class="level-badge ${lv.c}">${lv.n}</span><span class="level-text">${lv.l}</span></div><div class="vocab-grid">${ws.map(w=>{const r=state.revV.has('v-'+w.idx);const mr=state.revM.has('m-'+w.idx);const ar=state.revA.has('a-'+w.idx);
const mH=w.morph?(mr?`<div class="vocab-morph-reveal"><div class="morph-main"><span class="morph-root">${w.morph}</span> = ${w.morphEs}</div></div>`:`<button class="vocab-morph-btn" data-show-morph="${w.idx}">${t.morphBtn}</button>`):'';
const aH=w.ant?(ar?`<div class="vocab-ant-reveal"><div class="ant-word-big">${wk(w)} ↔ ${w.ant}</div><div class="ant-es">${w.es} ↔ ${w.antEs}</div></div>`:`<button class="vocab-ant-btn" data-show-ant="${w.idx}">${t.antBtn}</button>`):'';
return`<div class="vocab-card" data-vocab="${w.idx}"><div class="w">${wk(w)}</div>${r?`<div class="es">${w.es}</div>${w.note?`<div class="note">${w.note}</div>`:''}`:''}${mH}${aH}${!r&&!w.ant&&!w.morph?`<div class="flip-hint">↓</div>`:!r&&(w.ant||w.morph)?`<div class="flip-hint" style="margin-top:6px">${t.transHint}</div>`:''}</div>`;}).join('')}</div>`;});return h;}

function rLetra(s){return`<p class="section-label">${t.letra}</p><div class="letra-box">${(s.phrases||[]).map(p=>`<span style="background:#fef08a;padding:1px 4px;border-radius:3px">${(wk(p)||p.eu||p.fr||'').replace(/\n/g,'<br>')}</span> <span style="color:#2563eb;font-size:.85rem">(${p.es.replace(/\n/g,' / ')})</span><br>`).join('<br>')}</div>`;}

function rPhrases(s){const ps=s.phrases||[];const allR=ps.every((_,i)=>state.revP.has('p-'+i));
return`<p class="section-label">${t.phrases}</p><button class="reveal-all-btn" data-action="reveal-all-phrases">${allR?t.hideAll:t.showAll}</button>${ps.map((p,i)=>{const rev=state.revP.has('p-'+i);const gO=state.openGrammar.has('g-'+i);const hk=!!p.known;const txt=wk(p)||p.eu||p.fr||'';
return`<div class="phrase-block ${hk?'has-known':''}" data-flip="${i}"><div class="phrase-w">${txt.replace(/\n/g,'<br>')}</div>${rev?`<div class="phrase-es">${p.es.replace(/\n/g,'<br>')}</div>${p.note?`<div class="phrase-note">${p.note}</div>`:''}${hk?`<span class="known-tag">${D.lang==='eu'?'Ezaguna':'Déjà vu'}: ${p.known}</span>`:''}${p.grammar?`<button class="grammar-toggle" data-grammar="${i}">${gO?'▾':'▸'} ${p.grammar.label}</button>${gO?`<div class="grammar-box">${p.grammar.rows.map(r=>`<span class="label">${r[0]}</span> → <span class="conj">${r[1]}</span> — ${r[2]}<br>`).join('')}</div>`:''}`:''}`:`<div class="flip-hint">↓</div>`}</div>`;}).join('')}`;}

function rPraktika(s){return`<p class="section-label">${t.praktika}</p>${(s.praktika||[]).map((p,i)=>{const rv=state.revPr.has('pr-'+i);const txt=wk(p)||p.eu||p.fr||'';
return`<div class="praktika-block"><div class="praktika-original">${txt}</div><div class="praktika-trans">${p.es}</div><div class="praktika-challenge">${p.challenge}</div><input class="praktika-input" type="text" placeholder="..." data-praktika="${i}"><button class="praktika-show" data-show-praktika="${i}">${rv?t.hideAns:t.showAns}</button>${rv?`<div class="praktika-answer"><div class="ans">${p.answer}</div><div class="exp">${p.explanation}</div></div>`:''}</div>`;}).join('')}`;}

function genWQ(s){const qs=[];const v=s.vocab||[];const k=D.lang==='eu'?'eu':'fr';
[...v].sort(()=>Math.random()-.5).slice(0,5).forEach(w=>{const wr=v.filter(x=>x[k]!==w[k]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w[k],promptLabel:t.qWhat,answer:w.es,options:shuffle([w.es,...wr])});});
[...v].sort(()=>Math.random()-.5).slice(0,5).forEach(w=>{const wr=v.filter(x=>x[k]!==w[k]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[k]);qs.push({prompt:w.es,promptLabel:t.qHow,answer:w[k],options:shuffle([w[k],...wr])});});
(s.known||[]).slice(0,3).forEach(w=>{const wr=v.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w[k],promptLabel:t.qRemember,answer:w.es,options:shuffle([w.es,...wr])});});
return shuffle(qs).slice(0,12);}
function genPQ(s){const qs=[];const k=D.lang==='eu'?'eu':'fr';const ps=(s.phrases||[]).filter(p=>p.es.length<65);
ps.sort(()=>Math.random()-.5).slice(0,5).forEach(p=>{const wr=ps.filter(x=>x.es!==p.es).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:(p[k]||'').replace(/\n/g,' / '),promptLabel:t.qTranslate,answer:p.es,options:shuffle([p.es,...wr])});});
return shuffle(qs).slice(0,10);}
function genCombinedQ(){const qs=[];const k=D.lang==='eu'?'eu':'fr';const allV=Object.values(D.songs).flatMap(s=>s.vocab||[]);
[...allV].sort(()=>Math.random()-.5).slice(0,8).forEach(w=>{const wr=allV.filter(x=>x[k]!==w[k]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w[k],promptLabel:t.qWhat,answer:w.es,options:shuffle([w.es,...wr])});});
[...allV].sort(()=>Math.random()-.5).slice(0,8).forEach(w=>{const wr=allV.filter(x=>x[k]!==w[k]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[k]);qs.push({prompt:w.es,promptLabel:t.qHow,answer:w[k],options:shuffle([w[k],...wr])});});
return shuffle(qs).slice(0,16);}

function rQB(q){if(state.qMode===null)return`<div class="quiz-mode-btns"><button class="quiz-mode-btn test" data-qmode="test">${t.options}</button><button class="quiz-mode-btn reveal" data-qmode="reveal">${t.answer}</button></div>`;
if(state.qMode==='test')return`<div class="quiz-options">${q.options.map((o,i)=>{let c='quiz-opt';if(state.qAns){c+=' locked';if(o===q.answer)c+=' correct';else if(o===state.qSel&&o!==q.answer)c+=' wrong';else c+=' dim';}return`<button class="${c}" data-answer="${i}">${o}</button>`;}).join('')}</div>${state.qAns?`<button class="quiz-next" data-action="next-q">${t.next}</button>`:''}`;
return`<div class="quiz-reveal-answer"><div class="ans-label">${t.answer}</div><div class="ans-text">${q.answer}</div></div><button class="quiz-next" data-action="next-q">${t.next}</button>`;}
function rQuiz(s){if(!state.qType)return`<div class="quiz-header"><h3>${t.quiz}</h3></div><div class="quiz-type-btns"><div class="quiz-type-btn" data-quiztype="words"><div class="qt-icon">Aa</div>${t.quizWords}</div><div class="quiz-type-btn" data-quiztype="phrases"><div class="qt-icon">"</div>${t.quizPhrases}</div></div>`;
if(state.qDone)return rQuizResult();
if(!state.qQs.length){state.qQs=state.qType==='words'?genWQ(s):genPQ(s);state.qI=0;state.qS=0;state.qT=0;state.qAns=false;state.qMode=null;}
const q=state.qQs[state.qI];const pr=(state.qI/state.qQs.length)*100;
return`<div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div><div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${rQB(q)}</div>`;}
function renderCombinedQ(){if(state.qDone)return`<div class="top-bar"><button class="back-btn" data-action="back">←</button><h2>${t.combined}</h2></div>`+rQuizResult();
if(!state.qQs.length){state.qQs=genCombinedQ();state.qI=0;state.qS=0;state.qT=0;state.qAns=false;state.qMode=null;}
const q=state.qQs[state.qI];const pr=(state.qI/state.qQs.length)*100;
return`<div class="top-bar"><button class="back-btn" data-action="back">←</button><h2>${t.combined}</h2></div><div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div><div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${rQB(q)}</div>`;}
function rQuizResult(){const p=state.qT>0?Math.round((state.qS/state.qT)*100):0;const m=state.qT===0?t.allSeen:p>=80?t.excellent:p>=50?t.good:t.retry;const sk=state.qQs.length-state.qT;
return`<div class="quiz-result"><div class="score">${state.qT>0?state.qS+' / '+state.qT:'—'}</div><div class="msg">${m}${sk>0?'<br><span style="font-size:.82rem;color:var(--storm)">'+sk+' '+t.seen+'</span>':''}</div><button class="restart-btn" data-action="restart-quiz">${t.again}</button> <button class="restart-btn outline" data-action="quiz-menu">${t.back}</button></div>`;}

function renderGernika(){const g=D.gernika;if(!g)return'';
return`<div class="top-bar"><button class="back-btn" data-action="back">←</button><h2>${g.title}</h2></div><div class="intro-section" style="margin-bottom:24px"><h3>Ken Zazpi — ${g.title}</h3><p style="font-size:.92rem;color:var(--mid);line-height:1.7">${g.introEs}</p></div><div class="gernika-box">${g.lines.map(l=>{if(!l.text)return'<br>';if(l.eu)return`<span style="background:#fef08a;padding:1px 4px;border-radius:3px;font-weight:600">${l.text}</span> <span style="color:#2563eb;font-size:.85rem">(${l.es})</span><br>`;return l.text+'<br>';}).join('')}</div>`;}

function bindEvents(){
document.querySelectorAll('.song-card').forEach(el=>el.addEventListener('click',()=>{
  if(el.dataset.song==='gernika'){state.view='gernika';render();return;}
  state.view='song';state.song=el.dataset.song;state.tab='intro';clearSets();render();}));
document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;if(el.dataset.tab==='quiz'){resetQ();state.qType=null;}render();}));
document.querySelectorAll('[data-action="back"]').forEach(el=>el.addEventListener('click',()=>{state.view='landing';state.song=null;render();}));
document.querySelectorAll('.vocab-card[data-vocab]').forEach(el=>el.addEventListener('click',()=>{const k='v-'+el.dataset.vocab;state.revV.has(k)?state.revV.delete(k):state.revV.add(k);render();}));
document.querySelectorAll('[data-action="reveal-all-vocab"]').forEach(el=>el.addEventListener('click',()=>{const s=getSong();const all=s.vocab.every((_,i)=>state.revV.has('v-'+i));s.vocab.forEach((_,i)=>{const k='v-'+i;all?state.revV.delete(k):state.revV.add(k);});render();}));
document.querySelectorAll('.phrase-block[data-flip]').forEach(el=>el.addEventListener('click',(e)=>{if(e.target.closest('.grammar-toggle')||e.target.closest('.grammar-box'))return;const k='p-'+el.dataset.flip;state.revP.has(k)?state.revP.delete(k):state.revP.add(k);render();}));
document.querySelectorAll('[data-action="reveal-all-phrases"]').forEach(el=>el.addEventListener('click',()=>{const s=getSong();const all=s.phrases.every((_,i)=>state.revP.has('p-'+i));s.phrases.forEach((_,i)=>{const k='p-'+i;all?state.revP.delete(k):state.revP.add(k);});render();}));
document.querySelectorAll('.grammar-toggle').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k='g-'+el.dataset.grammar;state.openGrammar.has(k)?state.openGrammar.delete(k):state.openGrammar.add(k);render();}));
document.querySelectorAll('[data-show-praktika]').forEach(el=>el.addEventListener('click',()=>{const k='pr-'+el.dataset.showPraktika;state.revPr.has(k)?state.revPr.delete(k):state.revPr.add(k);const inp={};document.querySelectorAll('.praktika-input').forEach(i=>{inp[i.dataset.praktika]=i.value;});render();document.querySelectorAll('.praktika-input').forEach(i=>{if(inp[i.dataset.praktika])i.value=inp[i.dataset.praktika];});}));
document.querySelectorAll('[data-show-morph]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k='m-'+el.dataset.showMorph;state.revM.has(k)?state.revM.delete(k):state.revM.add(k);render();}));
document.querySelectorAll('.vocab-morph-reveal').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const card=el.closest('.vocab-card');if(card){state.revM.delete('m-'+card.dataset.vocab);render();}}));
document.querySelectorAll('[data-show-ant]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k='a-'+el.dataset.showAnt;state.revA.has(k)?state.revA.delete(k):state.revA.add(k);render();}));
document.querySelectorAll('.vocab-ant-reveal').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const card=el.closest('.vocab-card');if(card){state.revA.delete('a-'+card.dataset.vocab);render();}}));
document.querySelectorAll('[data-action="combined-quiz"]').forEach(el=>el.addEventListener('click',()=>{state.view='combined';resetQ();render();}));
document.querySelectorAll('[data-quiztype]').forEach(el=>el.addEventListener('click',()=>{state.qType=el.dataset.quiztype;resetQ();render();}));
document.querySelectorAll('[data-action="quiz-menu"]').forEach(el=>el.addEventListener('click',()=>{state.qType=null;resetQ();render();}));
document.querySelectorAll('[data-qmode]').forEach(el=>el.addEventListener('click',()=>{state.qMode=el.dataset.qmode;if(state.qMode==='reveal')state.qAns=true;render();}));
document.querySelectorAll('.quiz-opt:not(.locked)').forEach(el=>el.addEventListener('click',()=>{if(state.qAns)return;const q=state.qQs[state.qI];const sel=q.options[parseInt(el.dataset.answer)];state.qSel=sel;state.qAns=true;state.qT++;if(sel===q.answer)state.qS++;render();}));
document.querySelectorAll('[data-action="next-q"]').forEach(el=>el.addEventListener('click',()=>{state.qI++;state.qAns=false;state.qSel=null;state.qMode=null;if(state.qI>=state.qQs.length)state.qDone=true;render();}));
document.querySelectorAll('[data-action="restart-quiz"]').forEach(el=>el.addEventListener('click',()=>{const tt=state.qType;const s=state.view==='combined'?null:getSong();resetQ();state.qType=tt;state.qQs=state.view==='combined'?genCombinedQ():tt==='words'?genWQ(s):genPQ(s);render();}));}

// LOAD DATA
const params=new URLSearchParams(window.location.search);
const songId=params.get('song')||params.get('s');
if(songId){
  fetch('data/'+songId+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
    D=d;if(D.type==='special')document.body.classList.add('special');render();
  }).catch(e=>{document.getElementById('app').innerHTML=`<div class="loading">No se encuentra: data/${songId}.json</div>`;});
}else{
  document.getElementById('app').innerHTML=`<div class="loading" style="text-align:left;max-width:400px;margin:60px auto">
  <h2 style="margin-bottom:16px">Hamasei Puntu</h2>
  <p style="margin-bottom:16px;color:var(--mid)">Elige una entrega:</p>
  <div id="songlist"></div></div>`;
  fetch('.').then(()=>{
    const links=[
      {s:'sorotan-bele',t:'01. Sorotan Bele',d:'Atalaia + Mariñelaren zai'},
      {s:'zea-mays',t:'02. Zea Mays',d:'Elektrizitatea + Negua joan da ta'},
      {s:'korrika',t:'Edizio Berezia: Korrika',d:'Fermín Muguruza (2021)',special:true},
      {s:'ken-zazpi',t:'03. Ken Zazpi',d:'Zapalduen olerkia + Ilargia + Gernika'},
    ];
    document.getElementById('songlist').innerHTML=`
    <div style="margin-bottom:8px"><span style="font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#58cc02">1. Blokea — Canon rock 90-00</span></div>
    ${links.filter(l=>!l.special).map(l=>`<a href="?song=${l.s}" style="display:block;padding:14px 18px;margin-bottom:8px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;text-decoration:none;color:#3c3c3c"><strong>${l.t}</strong><br><span style="font-size:.85rem;color:#777">${l.d}</span></a>`).join('')}
    ${links.filter(l=>l.special).map(l=>`<a href="?song=${l.s}" style="display:block;padding:14px 18px;margin-bottom:8px;background:linear-gradient(135deg,#e85d26,#d44a1c);border:none;border-radius:8px;text-decoration:none;color:#fff"><strong>${l.t}</strong><br><span style="font-size:.85rem;opacity:.85">${l.d}</span></a>`).join('')}
    <div style="margin-top:24px;padding:16px 18px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;border-left:3px solid #58cc02">
      <div style="font-size:.82rem;color:#3c3c3c;line-height:1.6"><strong>Hurrengoa / Próximamente:</strong><br>
      <span style="color:#777">29 iraila</span> — Repaso bloque 1<br>
      <span style="color:#777">1 urria</span> — 2. Blokea: primera entrega</div>
    </div>`;`;
  });
}
</script>
